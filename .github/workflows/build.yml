name: Build e Testes (.NET)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET SDK 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restaurar dependências
        run: dotnet restore src/GkwvxYtReplay.csproj

      - name: Compilar projeto principal (Release)
        run: dotnet build src/GkwvxYtReplay.csproj -c Release --no-restore

      - name: Executar testes unitários NDJSON
        if: hashFiles('tests/GkwvxYtReplay.Tests.csproj') != ''
        run: dotnet test tests/GkwvxYtReplay.Tests.csproj -c Release
