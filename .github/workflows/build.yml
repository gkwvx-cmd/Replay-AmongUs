name: Build e Testes gkwvxYT Replay

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restaurar e testar visualizador offline
        run: |
          dotnet restore src/GkwvxYtReplay.csproj
          dotnet build src/GkwvxYtReplay.csproj -c Release --no-restore
          dotnet test tests/GkwvxYtReplay.Tests.csproj -c Release

      - name: Restaurar e compilar DLL do Mod Among Us
        run: |
          dotnet restore mod/GkwvxYtAmongUsReplay.csproj
          dotnet build mod/GkwvxYtAmongUsReplay.csproj -c Release --no-restore

      - name: Disponibilizar DLL do Mod para download
        uses: actions/upload-artifact@v4
        with:
          name: GkwvxYtAmongUsReplay-DLL
          path: mod/bin/Release/net6.0/GkwvxYtAmongUsReplay.dll
