name: Build Mod Among Us

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restaurar pacotes do BepInEx e Among Us
        run: dotnet restore GkwvxYtAmongUsReplay.csproj

      - name: Compilar DLL do Mod
        run: dotnet build GkwvxYtAmongUsReplay.csproj -c Release --no-restore

      - name: Disponibilizar DLL para download
        uses: actions/upload-artifact@v4
        with:
          name: GkwvxYtAmongUsReplay-DLL
          path: bin/Release/net6.0/GkwvxYtAmongUsReplay.dll
